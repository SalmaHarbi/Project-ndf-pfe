services:
  postgres:
    image: postgres:latest
    container_name: projetdb-central
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: Salma123@
      POSTGRES_DB: usedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
      - "8080:8080"

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafkaa
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    depends_on:
      - zookeeper

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloakk
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: projetdb
      KC_DB_USERNAME: dev
      KC_DB_PASSWORD: Salma123@
    ports:
      - "8088:8080"
      - "8443:8443"
      - "9000:9000"
    depends_on:
      - postgres

  eurekaserver:
    image: eureka-server:latest
    container_name: eurekaserver
    environment:
      SPRING_APPLICATION_NAME: EurekaServer
      SERVER_PORT: 8761
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    ports:
      - "8761:8761"
    restart: unless-stopped

  configserver:
    image: config-server:latest
    container_name: configserver
    ports:
      - "9999:9999"
    environment:
      SPRING_APPLICATION_NAME: ConfigService
      SERVER_PORT: 9999
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://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@github.com/SalmaHarbi/ConfigServer-PFE.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eurekaserver:8761/eureka
      SPRING_CLOUD_DISCOVERY_ENABLED: "true"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eurekaserver

volumes:
  postgres_data: